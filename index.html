<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mero | Wedding Photographer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: url('background.jpeg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background: #d4af37;
            color: #121212;
            border-color: #d4af37;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4);
        }
        .btn i {
            margin-left: 10px;
            font-size: 18px;
        }
        /* تصميم صفحة الحجز الممصغرة والمرتبة */
        #booking-view {
            display: none;
            background: rgba(25, 25, 25, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            text-align: right;
        }
        #booking-view h2 {
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 15px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #cccccc;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #d4af37;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .submit-btn {
            flex: 1;
            background: #d4af37;
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .back-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الواجهة الرئيسية -->
        <div id="main-view">
            <img src="profile.jpeg" alt="Mero" class="profile-img">
            <h1>Mero</h1>
            <div class="subtitle">Wedding Photographer</div>

            <a href="#" class="btn" onclick="openBookingForm('حجز جلسة تصوير', '0')">
                <i class="fa-solid fa-calendar-check"></i> احجز ميعادك الآن
            </a>
            <a href="https://wa.me/20109xxxxxxxx" target="_blank" class="btn">
                <i class="fa-brands fa-whatsapp"></i> تواصل عبر واتساب
            </a>
            <a href="https://instagram.com" target="_blank" class="btn">
                <i class="fa-brands fa-instagram"></i> إنستجرام
            </a>
            <a href="https://tiktok.com" target="_blank" class="btn">
                <i class="fa-brands fa-tiktok"></i> تيك توك
            </a>
        </div>

        <!-- نموذج الحجز المصغر والمعدل -->
        <div id="booking-view">
            <h2 id="bk-title">حجز ميعاد</h2>
            <form id="bookingForm" onsubmit="submitBooking(event)">
                <input type="hidden" id="pkgName">
                <input type="hidden" id="pkgPrice">
                
                <div class="form-group">
                    <label>الاسم:</label>
                    <input type="text" id="clientName" required placeholder="أدخل اسمك الكريم">
                </div>
                
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="clientPhone" required placeholder="رقم الموبايل للتواصل">
                </div>
                
                <div class="form-group">
                    <label>تاريخ الحجز:</label>
                    <input type="date" id="clientDate" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">تأكيد الحجز</button>
                    <button type="button" class="back-btn" onclick="showMain()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // حط لينك السكريبت الخاص بك هنا بين العلامتين
        const SCRIPT_URL = "PUT_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
        // ==========================================

        function showMain() {
            document.getElementById('booking-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        function openBookingForm(name, price) {
            document.getElementById('pkgName').value = name;
            document.getElementById('pkgPrice').value = price;
            document.getElementById('bk-title').innerText = 'حجز: ' + name;
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('booking-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function submitBooking(e) {
            e.preventDefault();
            const data = {
                pkgName: document.getElementById('pkgName').value,
                pkgPrice: document.getElementById('pkgPrice').value,
                clientName: document.getElementById('clientName').value,
                clientPhone: document.getElementById('clientPhone').value,
                clientDate: document.getElementById('clientDate').value
            };

            if(SCRIPT_URL.includes("PUT_YOUR")) {
                alert("برجاء وضع رابط سكريبت جوجل في ملف الكود أولاً!");
                return;
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                alert('تم تسجيل الحجز بنجاح!');
                showMain();
                document.getElementById('bookingForm').reset();
            }).catch(() => {
                alert('حدث خطأ أثناء الإرسال، حاول مرة أخرى.');
            });
        }
    </script>
</body>
</html>
